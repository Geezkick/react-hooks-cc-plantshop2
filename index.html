<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantsy App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React and ReactDOM CDN -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Search Component
    function Search({ search, onSearchChange }) {
      return (
        <div className="mb-4">
          <input
            type="text"
            placeholder="Search plants..."
            value={search}
            onChange={(e) => onSearchChange(e.target.value)}
            className="w-full p-2 border rounded"
          />
        </div>
      );
    }

    // PlantForm Component
    function PlantForm({ onAddPlant }) {
      const [name, setName] = useState("");
      const [image, setImage] = useState("");
      const [price, setPrice] = useState("");

      function handleSubmit(e) {
        e.preventDefault();
        if (!name.trim() || !price.trim()) return;
        const newPlant = {
          id: Date.now(),
          name,
          image: image.trim() || "https://via.placeholder.com/100",
          price: parseFloat(price) || 0,
          soldOut: false,
        };
        onAddPlant(newPlant);
        setName("");
        setImage("");
        setPrice("");
      }

      return (
        <div onClick={handleSubmit} className="mb-4 flex flex-col gap-2">
          <input
            type="text"
            placeholder="Plant name"
            value={name}
            onChange={(e) => setName(e.target.value)}
            className="p-2 border rounded"
            required
          />
          <input
            type="text"
            placeholder="Image URL (optional)"
            value={image}
            onChange={(e) => setImage(e.target.value)}
            className="p-2 border rounded"
          />
          <input
            type="number"
            placeholder="Price (e.g., 19.99)"
            value={price}
            onChange={(e) => setPrice(e.target.value)}
            className="p-2 border rounded"
            required
            step="0.01"
            min="0"
          />
          <button
            type="submit"
            className="p-2 bg-green-500 text-white rounded hover:bg-green-600"
          >
            Add Plant
          </button>
        </div>
      );
    }

    // PlantCard Component
    function PlantCard({ plant, onToggleSoldOut, onDelete }) {
      return (
        <li className="flex justify-between items-center p-3 border rounded mb-2">
          <div className="flex items-center gap-4">
            <img
              src={plant.image}
              alt={plant.name}
              className="w-16 h-16 object-cover rounded"
              onError={(e) => (e.target.src = "https://via.placeholder.com/100")}
            />
            <div>
              <h3 className="text-lg font-semibold">{plant.name}</h3>
              <p>Price: ${plant.price.toFixed(2)}</p>
              <p>Status: {plant.soldOut ? "Sold Out" : "Available"}</p>
            </div>
          </div>
          <div className="flex gap-2">
            <button
              onClick={() => onToggleSoldOut(plant.id)}
              className="p-2 bg-blue-500 text-white rounded hover:bg-blue-600"
            >
              Toggle {plant.soldOut ? "Available" : "Sold Out"}
            </button>
            <button
              onClick={() => onDelete(plant.id)}
              className="p-2 bg-red-500 text-white rounded hover:bg-red-600"
            >
              Delete
            </button>
          </div>
        </li>
      );
    }

    // App Component
    function App() {
      const [plants, setPlants] = useState([
        {
          id: 1,
          name: "Monstera Deliciosa",
          image: "https://via.placeholder.com/100?text=Monstera",
          price: 29.99,
          soldOut: false,
        },
        {
          id: 2,
          name: "Fiddle Leaf Fig",
          image: "https://via.placeholder.com/100?text=Fiddle+Leaf",
          price: 49.99,
          soldOut: true,
        },
      ]);
      const [search, setSearch] = useState("");

      function handleAddPlant(newPlant) {
        setPlants([...plants, newPlant]);
      }

      function handleToggleSoldOut(id) {
        setPlants(
          plants.map((plant) =>
            plant.id === id ? { ...plant, soldOut: !plant.soldOut } : plant
          )
        );
      }

      function handleDeletePlant(id) {
        setPlants(plants.filter((plant) => plant.id !== id));
      }

      const displayedPlants = plants.filter((plant) =>
        plant.name.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="max-w-2xl mx-auto p-4">
          <h1 className="text-3xl font-bold text-center mb-4">🌿 Plantsy 🌱</h1>
          <Search search={search} onSearchChange={setSearch} />
          <PlantForm onAddPlant={handleAddPlant} />
          <ul className="list-none p-0">
            {displayedPlants.map((plant) => (
              <PlantCard
                key={plant.id}
                plant={plant}
                onToggleSoldOut={handleToggleSoldOut}
                onDelete={handleDeletePlant}
              />
            ))}
          </ul>
        </div>
      );
    }

    // Render the App
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
